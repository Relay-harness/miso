name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    name: Test and build (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check publication tree
        run: python3 Scripts/check_source.py
      - name: Run account-free core and reader tests
        run: python3 Scripts/test.py
      - name: Clean source-to-app build with verified dependency
        run: python3 Scripts/build.py
      - name: Package ad-hoc signed preview
        run: python3 Scripts/package.py
      - name: Upload test-build artifacts (not a notarized release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relay-cat-preview-macos-arm64
          path: |
            dist/*.zip
            dist/SHA256SUMS
            build/build-manifest.json
          if-no-files-found: error
          retention-days: 7

  dashboard:
    name: Collector and dashboard regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:server
      - run: npm run test:browser
